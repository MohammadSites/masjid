<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>معاينة شاشة الأذكار (تجريبي)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #0a0a12 url("media/background.png") center/cover no-repeat fixed; }
  </style>
</head>
<body>
  <!-- نفس التخطيط أثناء عرض شرائح الأذكار: بطاقات الصلاة مخفية، صندوق الأذكار كبير -->
  <div class="screen">
    <header class="topbar">
      <div class="topbar-center">
        <div class="mosque-name">مسجد خليل عبد الرحمن</div>
      </div>
    </header>

    <main class="hero adhkar-visible">
      <div class="hero-clock-group">
        <div class="sunrise-card hidden"><div class="name">الشروق</div><div class="time">6:15</div></div>
        <div class="hero-box hidden"><div class="hero-time">12:00:00</div></div>
        <div class="hijri-card sunrise-card hidden"><div class="time">—</div></div>
      </div>
      <div class="adhkar-box visible" id="adhkarBox">
        <div class="adhkar-title">الأذكار</div>
        <div class="adhkar-quote">
          إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا
        </div>
        <div class="adhkar-source">سورة الأحزاب ٥٦</div>
      </div>
    </main>

    <section class="prayer-cards hidden" id="prayerCards">
      <div class="prayer-card"><div class="name">الفجر</div><div class="time">5:00</div></div>
      <div class="prayer-card"><div class="name">الظهر</div><div class="time">12:00</div></div>
    </section>
  </div>
</body>
</html>
